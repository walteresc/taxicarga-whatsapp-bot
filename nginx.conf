# Nginx configuration for Taxi Carga CRM
# Production-ready reverse proxy + static file server

upstream django {
    server django:8000;
}

# Rate limiting for login
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

server {
    listen 8001;
    server_name localhost 127.0.0.1;
    
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1000;
    gzip_vary on;

    # ====== STATIC FILES & ASSETS ======
    # Serve Vue build and static assets (from frontend build)
    # Cache-busting via content hash in filename (e.g., index-Csy-aUEr.js)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        # Use max-age with must-revalidate to catch bundle updates
        # Hashed filenames ensure cache invalidation on code changes
        expires 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    location /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        expires 30d;
        access_log off;
    }

    location /logo.png {
        alias /usr/share/nginx/html/logo.png;
        expires 30d;
        access_log off;
    }

    location /loader.css {
        alias /usr/share/nginx/html/loader.css;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
        access_log off;
    }

    # ====== DASHBOARD CONVERSATION ENDPOINTS ======
    # Prefix location (higher priority than regex)
    location /dashboard/whatsapp/conversaciones/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_buffering on;
    }

    # ====== AUTHENTICATED MEDIA PROXY ======
    # Locally-stored WhatsApp attachments, served by Django (session auth) — never
    # let the SPA catch-all below swallow this and return index.html instead.
    location /media/proxy/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_cookie_flags csrftoken secure samesite=lax;
        proxy_cookie_flags sessionid secure httponly samesite=lax;
        proxy_buffering on;
    }

    # ====== SPA FALLBACK ======
    # Vue Router SPA fallback: serve index.html for unknown routes
    # Match SPA routes and serve from frontend build
    # try_files attempts to serve the actual file, then fallback to /index.html
    location / {
        alias /usr/share/nginx/html/;
        try_files $uri /index.html =404;
    }

    # Root route -> login
    location = / {
        return 302 /login;
    }

    # Redirect /login/ to /login (optional, but good for consistency)
    location = /login/ {
        return 301 /login;
    }

    # ====== API: AUTHENTICATION ======
    location /dashboard/api/auth/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        # csrftoken must stay JS-readable for the SPA's X-CSRFToken header pattern —
        # match it BEFORE the catch-all so it doesn't get forced httponly.
        proxy_cookie_flags csrftoken secure samesite=lax;
        proxy_cookie_flags sessionid secure httponly samesite=lax;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        
        # Rate limit login
        limit_req zone=login_limit burst=20 nodelay;
    }

    # ====== SSE: SERVER-SENT EVENTS ======
    location /dashboard/whatsapp/api/events/stream/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE-specific: no buffering, keep connection open
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # Disable gzip for SSE
        gzip off;
        
        # Long timeout for SSE
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Essential headers for SSE
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
        
        # Preserve cookies
        proxy_cookie_path / "/";
        # csrftoken must stay JS-readable for the SPA's X-CSRFToken header pattern —
        # match it BEFORE the catch-all so it doesn't get forced httponly.
        proxy_cookie_flags csrftoken secure samesite=lax;
        proxy_cookie_flags sessionid secure httponly samesite=lax;
    }

    # ====== API: WHATSAPP & CONVERSACIONES ======
    location /dashboard/whatsapp/api/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_buffering on;
    }

    location /dashboard/whatsapp/conversaciones/api/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_buffering on;
    }

    # ====== API: GENERAL ======
    location /api/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_buffering on;
    }

    location /dashboard/api/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_buffering on;
    }

    # ====== ADMIN ======
    location /admin/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/";
        proxy_buffering on;
    }

    # ====== WEBHOOKS ======
    # YCloud webhook: raw body preservation essential for HMAC
    location /webhooks/ycloud/v1/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No buffering for webhook
        proxy_buffering off;
        proxy_request_buffering off;
        
        # IMPORTANT: Preserve all headers for HMAC signature validation
        proxy_pass_request_headers on;
        
        # No caching
        proxy_cache off;
    }

    location /webhooks/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location /webhook/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # ====== HEALTH ======
    location /health/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ====== CATCH-ALL: DENY ======
    location ~ ^\. {
        deny all;
        access_log off;
    }

    # Deny access to Django views_static (not used in prod)
    location ~ ^/serve-static/ {
        deny all;
    }

    # Error pages
    error_page 502 503 504 @error_json;
    location @error_json {
        default_type application/json;
        return 503 '{"error": "Service temporarily unavailable"}';
    }
}
