{% extends "dashboard/base.html" %}

{% block content %}
<v-list dense>
  {% for item in menu_items %}
  <v-list-item link :to="item.path">
    <v-list-item-icon>
      <v-icon>{{ item.icon }}</v-icon>
    </v-list-item-icon>
    <v-list-item-content>
      <v-list-item-title>{{ item.title }}</v-list-item-title>
    </v-list-item-content>
  </v-list-item>
  {% endfor %}
</v-list>
{% endblock %}
